# Local/staging stack: PostgreSQL + API + web.  docker compose up --build
# Production: use managed PostgreSQL and real secrets (see docs/10-deployment.md).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: karting
      POSTGRES_USER: karting
      POSTGRES_PASSWORD: ${DB_PASSWORD:-karting-dev-password}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karting"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: server/Dockerfile }
    environment:
      DATABASE_URL: postgres://karting:${DB_PASSWORD:-karting-dev-password}@db:5432/karting
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a long random string}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports: ["3000:3000"]
    depends_on: { db: { condition: service_healthy } }

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args: { VITE_API_URL: "${PUBLIC_API_URL:-http://localhost:3000}" }
    ports: ["8080:80"]

volumes:
  pgdata:
